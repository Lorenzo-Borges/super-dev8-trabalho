        <div class="conteudo">
            <div>
                <h1 class="titulo-cadastro">Cadastro</h1>
            </div>

            <div class="cadastro">
                <form>
                    <label class="titulo" for="campo-nome">Nome</label>
                    <input type="text" id="campo-nome" placeholder="Nome" required>
                    <label class="titulo" for="campo-email">Email</label>
                    <input type="email" id="campo-email" placeholder="Email" required>
                    <label class="titulo" for="campo-data">Data de nascimento</label>
                    <input type="date" id="campo-data" required>
                    <label class="titulo" for="campo-senha">Crie sua senha</label>
                    <input type="password" id="campo-senha" placeholder="Senha" required>
                    <label class="titulo" for="campo-confirma">Confirme sua senha</label>
                    <input type="password" id="campo-confirma" placeholder="Confirme a senha" required>
                    <button type="submit">Cadastrar</button>
                    <a class="link-login" href="login.html">Já tenho conta</a>
                </form>
            </div>
        </div>
    </div>
