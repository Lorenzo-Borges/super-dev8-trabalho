        <aside class="navbar">

            <nav class="navbar-lista">
                <ul>

                    <li>
                        <a class="link-nav" href="catalogo.html">Catalogo</a>

                    </li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo">

            <h1 class="titulo">Configurações</h1>

            <div class="config">
                <div class="typeconfig">
                    <p class="clique">Tema:</p>
                    <button class="dark">Dark</button>
                    <button class="light">Light</button>
                </div>

                <div class="typeconfig">
                    <p class="clique">Permitir notificações</p>
                    <input type="checkbox">
                </div>

                <div class="typeconfig">
                    <p class="clique">Vizualização de perfil</p>
                    <input type="radio" id="todos" name="perfil">
                    <label for="todos">Todos</label>

                    <input type="radio" id="amigos" name="perfil">
                    <label for="amigos">amigos</label>
                </div>
            </div>
            <div class="config">
                <div class="typeconfig">
                    <p class="clique">idioma</p>
                    <select name="idioma" id="idioma">
                        <option value="pt">Português</option>
                        <option value="en">Inglês</option>
                        <option value="zh">Mandarim</option>
                        <option value="hi">Hindi</option>
                        <option value="es">Espanhol</option>
                        <option value="fr">Francês</option>
                        <option value="ar">Árabe</option>
                        <option value="bn">Bengali</option>
                        <option value="ru">Russo</option>
                        <option value="id">Indonésio</option>

                    </select>
                </div>
                <div class="typeconfig">
                    <p class="clique">Leitor de tela</p>
                    <input type="checkbox">
                </div>
            </div>
        </main>
    </div>
